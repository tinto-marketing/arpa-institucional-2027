.hero{position:relative;height:100svh;scroll-snap-align:start;overflow:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:clamp(26px,5vw,80px);background:var(--vinho)}
.tag{position:absolute;top:20px;right:24px;font:500 .62rem var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--rose)}
.replay{position:absolute;bottom:18px;right:22px;font:500 .6rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--rose);opacity:.5;cursor:pointer;user-select:none}
.replay:hover{opacity:1}
.eye{position:absolute;top:clamp(26px,5vw,80px);left:0;right:0;font:500 .72rem var(--mono);letter-spacing:.24em;text-transform:uppercase;color:var(--rose);opacity:0;transition:opacity 1.8s ease}
.is-in .eye{opacity:.85}
.line{position:absolute;bottom:clamp(30px,6vh,74px);left:0;right:0;font-style:italic;font-weight:300;font-size:clamp(1.15rem,2vw,1.9rem);color:var(--cream);opacity:0;transition:opacity 2s ease}
.is-in .line{opacity:.94}
.stage{position:relative;width:min(80vw,900px)}
.stage .logo{width:100%;height:auto;display:block;color:var(--cream);opacity:0;transform:scale(1.14)}
.is-in .stage .logo{opacity:1;transform:none}
.bars{position:absolute;inset:-4% -1%;display:flex;pointer-events:none}
.bars i{flex:1;background:var(--vinho);transform:translateY(0)}
.glow{position:absolute;inset:-34% -14%;z-index:-1;background:radial-gradient(ellipse at center, rgba(242,184,208,.18), rgba(101,0,47,0) 62%);opacity:0;transition:opacity 2.4s ease}
.is-in .glow{opacity:1}

/* A1 — PROLONGADA (cascata longa, entrada ampla) */
.prolong .bars i{transition:transform 3s var(--eout)}
.prolong.is-in .bars i{transform:translateY(-104%)}
.prolong.is-in .bars i:nth-child(even){transform:translateY(104%)}
.prolong.is-in .stage .logo{transition:opacity .1s ease 1.6s, transform 4s var(--eout) 1.6s}
.prolong.is-in .stage .logo{animation:breathe 13s ease-in-out 6s infinite}
.prolong .eye{transition-delay:.5s}.prolong .line{transition-delay:5s}

/* A2 — CINEMÁTICA (cascata longa + brilho varre o logo) */
.cine .bars i{transition:transform 2.8s var(--eout)}
.cine.is-in .bars i{transform:translateY(-104%)}
.cine.is-in .bars i:nth-child(even){transform:translateY(104%)}
.cine.is-in .stage .logo{transition:opacity .1s ease 1.5s, transform 3.6s var(--eout) 1.5s}
.cine.is-in .sheen{opacity:1;animation:sheen 2.6s cubic-bezier(.4,0,.2,1) 4.4s 1 forwards}
.cine.is-in .stage .logo{animation:breathe 13s ease-in-out 7.5s infinite}
.cine .eye{transition-delay:.5s}.cine .line{transition-delay:6.4s}

@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.024)}}
@keyframes sheen{from{background-position:130% 0}to{background-position:-160% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.bars,.sheen{display:none}.stage .logo,.eye,.line{opacity:1!important;transform:none!important}}
</style></head><body>
